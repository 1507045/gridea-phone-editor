name: Build Release APK

# 触发：
#   1) 推送形如 v1.0.0 的 tag → 自动构建并把 APK 挂到同名 Release
#   2) 在 Actions 页面手动 Run（workflow_dispatch）→ 只上传 artifact，不建 Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# softprops/action-gh-release 建 Release 需要写权限
permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      # 注意：API 37 起 SDK 包名带次版本号。
      # 写 "platforms;android-37" 会直接 "Failed to find package" 并以 exit 1 失败，
      # 必须写 "platforms;android-37.0"。
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Show installed SDK packages
        run: sdkmanager --list_installed

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK with version
        run: |
          set -euo pipefail
          ls -la app/build/outputs/apk/debug/
          mv app/build/outputs/apk/debug/app-debug.apk \
             "app/build/outputs/apk/debug/gridea-phone-editor-${{ github.ref_name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: gridea-phone-editor-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
