name: Build Release APK

# 触发：
#   1) 推送形如 v1.0.0 的 tag → 自动构建并把 APK 挂到同名 Release
#   2) 在 Actions 页面手动 Run（workflow_dispatch）→ 只上传 artifact，不建 Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# softprops/action-gh-release 建 Release 需要写权限
permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages & accept licenses
        run: |
          sdkmanager "platforms;android-37" "build-tools;37.0.0"
          yes | sdkmanager --licenses

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK with version tag
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             "app/build/outputs/apk/debug/gridea-phone-editor-${{ github.ref_name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gridea-phone-editor-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
